services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: powerline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: brings the schema up to date. Everything that touches the
  # database waits for this to exit successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    restart: "no"
    volumes:
      - ./backend:/app
      - ./VERSION:/etc/powerline/VERSION:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    volumes:
      - ./backend:/app
      - ./embed/dist:/app/embed-dist
      - ./VERSION:/etc/powerline/VERSION:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Reached through Caddy on port 80; run tests with `docker compose exec backend`.
    # Only the dev stack trusts every forwarding hop — production sets
    # TRUSTED_PROXIES to the real proxy addresses instead.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --proxy-headers
      - --forwarded-allow-ips=*

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - backend
      - frontend

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    volumes:
      - ./backend:/app
      - ./VERSION:/etc/powerline/VERSION:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    volumes:
      - ./backend:/app
      - ./VERSION:/etc/powerline/VERSION:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
